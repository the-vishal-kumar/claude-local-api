# /etc/nginx/conf.d/claude.capgrid.in.conf
#
# Reverse proxy for the claude-local-api Go service. The app listens on
# 127.0.0.1:8787 (CLAUDE_API_ADDR) and does its own routing. Real routes:
#   POST /v1/run        run a task (long-running, large request/response bodies)
#   GET  /healthz       liveness probe
#   GET  /docs          Swagger UI (loads its JS/CSS from a CDN)
#   GET  /openapi.json  OpenAPI spec

upstream claude {
    server 127.0.0.1:8787;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name claude.capgrid.in;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name claude.capgrid.in;

    # Multipart uploads can total ~100 MiB (CLAUDE_MAX_UPLOAD_TOTAL_BYTES);
    # leave headroom over that.
    client_max_body_size 110M;

    ssl_certificate /etc/letsencrypt/live/claude.capgrid.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/claude.capgrid.in/privkey.pem;

    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/claude.access.log;
    error_log  /var/log/nginx/claude.error.log;

    # Tasks can run up to CLAUDE_TASK_TIMEOUT (default 5m, configurable higher),
    # so keep the proxy timeouts generous.
    proxy_connect_timeout 600s;
    proxy_send_timeout    600s;
    proxy_read_timeout    600s;

    send_timeout          600s;
    keepalive_timeout     75s;

    client_body_timeout   120s;
    client_header_timeout 120s;

    # Shared proxy settings. Connection "" lets the upstream keepalive pool stay
    # warm (it strips the default "close" hop-by-hop header).
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Run a task: large request/response bodies; stream both ways (no disk
    # buffering) and rely on the generous timeouts above.
    location = /v1/run {
        proxy_pass http://claude;

        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Liveness probe: fast, buffered, short read timeout.
    location = /healthz {
        proxy_pass http://claude;

        proxy_buffering on;
        proxy_read_timeout 60s;
    }

    # Everything else the app serves (/docs, /openapi.json, future routes).
    location / {
        proxy_pass http://claude;

        proxy_buffering on;
    }

    # Block hidden files
    location ~ /\. {
        deny all;
    }
}
